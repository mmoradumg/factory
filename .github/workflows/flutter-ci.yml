name: Factory Flutter Android preflight

on:
  pull_request:
    branches: [main]
    paths:
      - 'android/**'
      - 'lib/**'
      - 'test/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'analysis_options.yaml'
      - '.github/workflows/flutter-ci.yml'
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'lib/**'
      - 'test/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'analysis_options.yaml'
      - '.github/workflows/flutter-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: factory-flutter-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-debug:
    name: Flutter tests and debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Configure Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Inspect toolchains
        run: |
          java -version
          flutter --version
          flutter doctor -v
      - name: Resolve exactly locked dependencies
        run: flutter pub get --enforce-lockfile
      - name: Static analysis
        run: flutter analyze
      - name: Widget and unit tests
        run: flutter test
      - name: Assemble unsigned debug APK
        run: flutter build apk --debug
      - name: Upload debug APK for testing
        uses: actions/upload-artifact@v4
        with:
          name: factory-android-debug-${{ github.sha }}
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7
